# RuoYi-Vue-Plus 本地开发专用中间件（与其他项目隔离，端口 3307/6380）
services:
  ruoyi-mysql:
    image: mysql:8.4
    container_name: ruoyi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ry-vue
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --lower_case_table_names=1
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ruoyi-mysql-data:/var/lib/mysql
  ruoyi-redis:
    image: redis:7.4-alpine
    container_name: ruoyi-redis
    command: redis-server --requirepass ruoyi123
    ports:
      - "127.0.0.1:6380:6379"
volumes:
  ruoyi-mysql-data:
